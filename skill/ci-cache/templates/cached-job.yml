# One job wired for the ci-cache engine: Rust (sccache over the Worker, the
# /home/user/<repo> bind mount, rust-cache for ~/.cargo only), Turbo (remote
# cache over the Worker) and Docker (BuildKit cache in the Actions cache).
# Delete the sections for stacks the repo does not have.
#
# Every cache step is continue-on-error and every cached path has an
# uncached fallback: a cache problem makes the run slower, never red.
#
# With boated-ci, the `run:` steps below become background tasks
# (ci-task.ts start <task> <<'EOF' ... EOF); keep the `cd` line in each.
# Pins are the ones the first rollout used; refresh them when you copy this.
# Store your Worker's URL as the Actions SECRET CI_CACHE_URL (not a variable:
# GitHub masks secrets in logs, so on a public repo the URL never shows up in
# run logs; Dependabot runs need it as a Dependabot secret too), and replace
# <sha> with a full commit SHA of the ci-cache repo (or your fork).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Everything here that reaches rustc enters sccache keys: the repo's Boat
  # environment must hold the same values (references/sandbox.md).
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNS_ON || 'boat-large' }}
    # Fork PRs get no OIDC token (no cache) and no paid runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC for the ci-cache session
    env:
      # Keep the sccache server (and its stats) alive until the last step.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # --- Docker first: it needs none of the setup below ----------------------
      # The runner gives the cache runtime to actions only; this exports it to
      # the `run:` steps for BuildKit's type=gha. Names only go to the log.
      - name: "docker: Actions cache runtime for BuildKit"
        continue-on-error: true # without it the image builds uncached
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              const value = process.env[name];
              if (!value) {
                core.info(`${name}: not set`);
                continue;
              }
              if (name === "ACTIONS_RUNTIME_TOKEN") core.setSecret(value);
              core.exportVariable(name, value);
              core.info(`${name}: exported`);
            }

      # --- Rust toolchain, then ci-cache, then rust-cache (this order) ---------
      # rust-toolchain.toml pins the release the image ships as `stable`, and
      # rustup knows toolchains only by name: rename the image's toolchain to
      # the pinned name, or rustup downloads the same release again. This goes
      # before any rustup/rustc/cargo call, since those install the pin.
      - name: "rust: toolchain"
        run: |
          pin=$(sed -nE 's/^channel *= *"([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' rust-toolchain.toml)
          toolchains="${RUSTUP_HOME:-$HOME/.rustup}/toolchains"
          for stable in "$toolchains"/stable-*; do
            [ -n "$pin" ] && [ -d "$stable" ] && [ ! -L "$stable" ] || continue
            pinned="$toolchains/$pin-${stable##*/stable-}"
            image=$("$stable/bin/rustc" -V 2>/dev/null || true)
            if [ -e "$pinned" ]; then
              echo "${pinned##*/} is already installed"
            elif [[ $image == "rustc $pin "* ]]; then
              mv "$stable" "$pinned" && ln -s "${pinned##*/}" "$stable" &&
                echo "The image's stable is rustc $pin: reused as ${pinned##*/}"
            else
              echo "::warning::The image's stable is '${image:-unknown}', not the pinned $pin: every run downloads $pin"
            fi
          done
          rustup toolchain install # from rust-toolchain.toml: pin an exact version there
          rustc --version
          cargo --version

      # Session from GitHub OIDC; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM and,
      # with Rust, RUSTC_WRAPPER=sccache + SCCACHE_WEBDAV_* + CARGO_INCREMENTAL=0
      # (only if the sccache server starts against the Worker). With a
      # Cargo.toml, mount-workdir: auto (the default) mounts the checkout at
      # /home/user/<repo>, the path Boat sandboxes build in, and compares CI's
      # cache fingerprint with the sandbox's (warnings on key mismatches).
      - name: ci-cache
        id: cache
        continue-on-error: true # a cache problem is a slow run, not a red one
        uses: OmarAlex24/ci-cache/setup@<sha> # pin a full commit SHA
        with:
          url: ${{ secrets.CI_CACHE_URL }} # a secret, not a variable: GitHub masks it in logs

      - name: Build directory
        if: steps.cache.outputs.workdir != ''
        env:
          WORKDIR: ${{ steps.cache.outputs.workdir }}
        run: echo "CI_WORKDIR=$WORKDIR" >>"$GITHUB_ENV"

      # After ci-cache on purpose: its key hashes CARGO*/RUST* variables, so
      # RUSTC_WRAPPER is in it. ~/.cargo only: compiled code comes from sccache.
      # Bump prefix-key whenever the path, the wrapper or the content changes.
      - name: "rust: cache ~/.cargo"
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --- Node / Turbo --------------------------------------------------------
      - name: "node: pnpm"
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # No `cache: pnpm`: under the bind mount pnpm cannot hard-link from a
      # restored store (EXDEV) and downloads everything anyway.
      - name: "node: Node 22"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Outputs go through env, never ${{ }} inside the script: `branch` is the
      # PR's head branch name, which the PR author chooses.
      - name: ci-cache check
        continue-on-error: true
        env:
          TIER: ${{ steps.cache.outputs.tier }}
          BRANCH: ${{ steps.cache.outputs.branch }}
          CI_CACHE_URL: ${{ secrets.CI_CACHE_URL }}
        run: |
          echo "tier: ${TIER:-none} (branch ${BRANCH:-none})"
          # TURBO_API is compared with the secret, never printed: the URL stays out of the log.
          case ${TURBO_API:-} in
            "") echo "TURBO_API unset" ;;
            "${CI_CACHE_URL%/}") echo "TURBO_API = the ci-cache Worker" ;;
            *) echo "TURBO_API is something else: an env: entry shadows it" ;;
          esac
          echo "TURBO_TOKEN=${TURBO_TOKEN:+set}"
          echo "RUSTC_WRAPPER=${RUSTC_WRAPPER:-unset}"
          echo "CI_WORKDIR=${CI_WORKDIR:-unset}"

      # --- Work ----------------------------------------------------------------
      - name: Rust
        run: |
          set -euo pipefail
          cd "${CI_WORKDIR:-$GITHUB_WORKSPACE}"
          cargo clippy --workspace --all-targets --locked
          cargo test --workspace --locked

      - name: Turbo
        run: |
          set -euo pipefail
          cd "${CI_WORKDIR:-$GITHUB_WORKSPACE}"
          pnpm install --frozen-lockfile
          pnpm turbo run build lint test

      - name: Docker
        run: |
          set -euo pipefail
          cd "${CI_WORKDIR:-$GITHUB_WORKSPACE}"
          if ! timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'; then
            echo "::error::Docker did not answer within 60 s"
            exit 1
          fi
          PS4='+ [${SECONDS}s] '
          set -x
          cache=()
          # `:+set`, not the value: set -x prints the test.
          if [ -n "${ACTIONS_RUNTIME_TOKEN:+set}" ] && [ -n "${ACTIONS_RESULTS_URL:-}${ACTIONS_CACHE_URL:-}" ]; then
            cache=(--cache-from "type=gha,scope=app"
              --cache-to "type=gha,scope=app,mode=max,ignore-error=true")
          else
            echo "No Actions cache runtime: the image builds uncached"
          fi
          # ignore-error covers only the export: retry any failure without the cache.
          if ! docker build "${cache[@]}" -t app:ci .; then
            [ "${#cache[@]}" -gt 0 ] || exit 1
            echo "::warning::docker build failed with the BuildKit cache: building without it"
            docker build -t app:ci .
          fi

      # --- Evidence (never red) -------------------------------------------------
      - name: sccache stats
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v sccache >/dev/null || { echo "no sccache on PATH"; exit 0; }
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"
          # The bind mount means both paths are one directory: same device:inode.
          if [ -n "${CI_WORKDIR:-}" ] && [ -d "$GITHUB_WORKSPACE/target" ]; then
            saved=$(stat -c '%d:%i' "$GITHUB_WORKSPACE/target")
            built=$(stat -c '%d:%i' "$CI_WORKDIR/target")
            echo "target/: workspace $saved, built $built" | tee -a "$RUNNER_TEMP/sccache-stats.txt"
            [ "$saved" = "$built" ] || echo "::warning::target/ under the workspace is not the one the build used"
          fi
          { echo '### sccache'; echo '```'; cat "$RUNNER_TEMP/sccache-stats.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      # One table in the job summary: tier, sccache hit rate, Turbo tasks from
      # cache and the sandbox vs CI fingerprint check. Never fails the job.
      - name: ci-cache report
        if: ${{ always() }}
        continue-on-error: true
        uses: OmarAlex24/ci-cache/report@<sha> # the same SHA as setup
