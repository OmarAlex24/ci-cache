openapi: 3.1.0
info:
  title: ci-cache
  version: 0.1.0
  summary: CI cache (Turbo and sccache) on Cloudflare R2, with anti-poisoning tiers.
  description: |
    Cloudflare Worker that stores the Turbo cache (Remote Cache API v8) and the sccache
    cache (WebDAV) in R2, per repository. The tier (`main`, `main-ro`, `rama`) comes from
    the client's identity, never from what it asks for. `rama` is the branch tier; its wire
    value is the fixed identifier `rama`.

    Flow: the client exchanges its credential (GitHub Actions OIDC or a sandbox key) for a
    session token at `POST /v1/session` and uses that token on `/v8/*` and `/dav/*`. Metrics
    (`/v1/stats*`) use separate read-only keys, which don't work for the cache.

    All errors are JSON `{ code, message }` with no internal details. Under `/v8/` the error
    is repeated as `error: { code, message }`, the format the turbo client reads.

    Turbo types adapted from the spec in
    [turborepo-remote-cache-cloudflare](https://github.com/AdiRishi/turborepo-remote-cache-cloudflare)
    (MIT, © 2023 Adishwar Rishi).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://ci-cache.example.workers.dev
    description: Replace with the URL of your deployed Worker
  - url: http://localhost:8787
    description: wrangler dev

tags:
  - name: session
    description: Exchange a credential (GitHub OIDC or a sandbox key) for a session token.
  - name: turbo
    description: Turborepo Remote Cache API v8.
  - name: sccache
    description: Minimal WebDAV for sccache's webdav backend.
  - name: metrics
    description: Usage metrics from Workers Analytics Engine, with a read-only key.

paths:
  /health:
    get:
      summary: Liveness check (the only endpoint without a token)
      operationId: health
      security: []
      responses:
        "200":
          description: The Worker is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }

  /v1/session:
    post:
      tags: [session]
      summary: Exchanges a credential for a session token
      operationId: createSession
      description: |
        With a GitHub Actions OIDC token (`Authorization: Bearer <JWT>`) it verifies the
        signature against the JWKS of `https://token.actions.githubusercontent.com`, `iss`,
        `aud == CACHE_AUDIENCE`, `exp`/`nbf` (30 s tolerance) and that `repository_owner`
        is in `ALLOWED_OWNERS`. The tier is decided in this order:

        1. `event_name` ∈ `MAIN_WRITE_EVENTS` and `ref` ∈ `MAIN_REFS` → `main`
        2. non-empty `head_ref` (pull_request, pull_request_target) → `rama` = `head_ref`
        3. `ref` ∈ `MAIN_REFS` (schedule, workflow_dispatch, ...) → `main-ro`
        4. any other ref → `rama` = the ref name without `refs/heads/`

        With a sandbox key (`Authorization: Bearer sk_...`) the body must include `branch`;
        the tier is ALWAYS `rama`, even if the branch is named `main`. In the OIDC case the
        body is ignored.
      security:
        - githubOidc: []
        - sandboxKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRequest" }
      responses:
        "200":
          description: Session token issued
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403":
          description: The repository owner is not in ALLOWED_OWNERS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503":
          description: Could not fetch GitHub's JWKS; retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v8/artifacts/status:
    get:
      tags: [turbo]
      summary: Remote cache status
      operationId: getArtifactStatus
      security: [{ sessionToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Always `enabled` for a valid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachingStatusResponse" }
        "400": { $ref: "#/components/responses/TurboBadRequest" }
        "401": { $ref: "#/components/responses/TurboUnauthorized" }
        "429": { $ref: "#/components/responses/TurboTooManyRequests" }

  /v8/artifacts:
    post:
      tags: [turbo]
      summary: Queries several artifacts at once
      operationId: artifactQuery
      description: Applies the same fallback as GET for each hash (`rama` tier → its branch, then main/). Non-hex hashes return `null`. At most 1000 hashes.
      security: [{ sessionToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactQueryRequest" }
      responses:
        "200":
          description: Map of hash → info or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactQueryResponse" }
        "400": { $ref: "#/components/responses/TurboBadRequest" }
        "401": { $ref: "#/components/responses/TurboUnauthorized" }
        "429": { $ref: "#/components/responses/TurboTooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /v8/artifacts/events:
    post:
      tags: [turbo]
      summary: Client cache events (validated and discarded)
      operationId: recordEvents
      security: [{ sessionToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items: { $ref: "#/components/schemas/CacheEvent" }
      responses:
        "200": { description: "Events accepted (empty body)" }
        "400": { $ref: "#/components/responses/TurboBadRequest" }
        "401": { $ref: "#/components/responses/TurboUnauthorized" }
        "429": { $ref: "#/components/responses/TurboTooManyRequests" }

  /v8/artifacts/{hash}:
    parameters:
      - $ref: "#/components/parameters/ArtifactHash"
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [turbo]
      summary: Downloads an artifact
      operationId: downloadArtifact
      description: |
        `main` and `main-ro` tiers: read `main/<repoId>/turbo/<hash>`. `rama` tier: reads
        `ramas/<repoId>/<branchKey>/turbo/<hash>` and, if missing, `main/<repoId>/turbo/<hash>`.
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Artifact
          headers:
            Content-Length: { schema: { type: integer } }
            x-artifact-duration:
              description: Task duration in ms, as uploaded
              schema: { type: integer }
            x-artifact-tag:
              description: Artifact signature, as uploaded
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "400": { $ref: "#/components/responses/TurboBadRequest" }
        "401": { $ref: "#/components/responses/TurboUnauthorized" }
        "429": { $ref: "#/components/responses/TurboTooManyRequests" }
        "404": { $ref: "#/components/responses/TurboNotFound" }
    head:
      tags: [turbo]
      summary: Checks whether an artifact exists (same fallback as GET)
      operationId: artifactExists
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Exists; same headers as GET, no body
          headers:
            Content-Length: { schema: { type: integer } }
            x-artifact-duration: { schema: { type: integer } }
            x-artifact-tag: { schema: { type: string } }
        "400": { description: "Invalid hash" }
        "401": { description: "Missing or invalid token" }
        "429": { description: "Too many requests without a valid credential from this IP" }
        "404": { description: "Does not exist" }
    put:
      tags: [turbo]
      summary: Uploads an artifact
      operationId: uploadArtifact
      description: |
        Writes to the tier's prefix (`main/` or the branch). `main-ro` gets 403. The body is
        streamed to R2: it requires `Content-Length` (411 if missing) and cannot exceed
        `MAX_ARTIFACT_BYTES` (100 MB by default, a Worker's request body limit).
      security: [{ sessionToken: [] }]
      parameters:
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 104857600 }
        - name: x-artifact-duration
          in: header
          schema: { type: string, pattern: "^[0-9]{1,15}$" }
        - name: x-artifact-tag
          in: header
          schema: { type: string, maxLength: 600 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "202":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactUploadResponse" }
        "400": { $ref: "#/components/responses/TurboBadRequest" }
        "401": { $ref: "#/components/responses/TurboUnauthorized" }
        "429": { $ref: "#/components/responses/TurboTooManyRequests" }
        "403":
          description: The token is read-only (main-ro)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurboError" }
        "411":
          description: Missing Content-Length
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurboError" }
        "413":
          description: Exceeds MAX_ARTIFACT_BYTES
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurboError" }

  /dav/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: |
          sccache path, e.g. `.sccache_check` or `8/e/f/<hash>`. Segments
          `[A-Za-z0-9._-]{1,128}`, no `.` or `..`, at most 512 characters. Repeated
          slashes are tolerated.
        schema: { type: string }
    description: |
      Minimal WebDAV for sccache's `webdav` backend (tested with sccache 0.19.0).
      Besides GET and PUT, it accepts **PROPFIND** (OpenAPI 3.1 cannot declare that method
      as an operation): only with `Depth: 0` and only on directories (a path ending in `/`,
      including `/dav/`), it answers `207 Multi-Status` with `<D:collection/>` and
      `<D:getlastmodified>`. `Depth` other than 0 → 403 (no listings); on a file → 404.
      Any other method → 405.
    x-webdav-methods: [GET, HEAD, PUT, PROPFIND]
    get:
      tags: [sccache]
      summary: Reads an object (branch → main/ fallback)
      operationId: davGet
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Object
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [sccache]
      summary: Writes an object to the tier's prefix
      operationId: davPut
      security: [{ sessionToken: [] }]
      parameters:
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 104857600 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "201": { description: "Stored" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403":
          description: Read-only token (main-ro); sccache switches to read-only mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "411": { description: "Missing Content-Length" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /v1/stats:
    get:
      tags: [metrics]
      summary: Hits, misses, bytes and time saved for a repository
      operationId: getStats
      description: |
        Queries Workers Analytics Engine (SQL API) with `CF_ACCOUNT_ID` and `CF_API_TOKEN`.
        Counts use `SUM(_sample_interval)`, so they are estimates if AE sampled.
      security: [{ statsKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Aggregated metrics
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403":
          description: The key is limited to other repositories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
        "503": { $ref: "#/components/responses/MetricsNotConfigured" }

  /v1/stats/branches:
    get:
      tags: [metrics]
      summary: Per-branch reuse of what the sandbox wrote
      operationId: getBranchStats
      description: |
        Per branch (`rama` tier only): sandbox writes, CI reads and hits, and CI hits on
        objects the sandbox wrote. `reuseAlert` is `true` when the sandbox wrote at least
        `REUSE_ALERT_MIN_WRITES` objects and CI hit none of them: it almost always means
        something differs between the sandbox and CI (checkout path, toolchain, flags).
        See `scripts/cache-fingerprint.sh`.
      security: [{ statsKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Per-branch metrics
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403":
          description: The key is limited to other repositories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
        "503": { $ref: "#/components/responses/MetricsNotConfigured" }

  /v1/stats/repos:
    get:
      tags: [metrics]
      summary: The repositories with traffic in the range, with their totals
      operationId: getRepoStats
      description: |
        So a frontend doesn't need to know the ids in advance. Two queries to the Analytics
        Engine SQL API: the totals per repo (with the latest request) and the `rama`-tier
        branches, to count each repo's `reuseAlert`s with the same rule as
        `/v1/stats/branches`. A key with `repoIds` only sees those repos (it filters; no 403).
        `repo` comes from the data points (since they store `blob8`) and, for older points,
        from `SANDBOX_KEYS`; if nobody knows it, `null`.
      security: [{ statsKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Repos sorted by latest request, most recent first
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReposResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
        "503": { $ref: "#/components/responses/MetricsNotConfigured" }

components:
  securitySchemes:
    githubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: GitHub Actions OIDC token with `aud = CACHE_AUDIENCE` (requires `permissions.id-token = write`).
    sandboxKey:
      type: http
      scheme: bearer
      description: Sandbox key `sk_...`; the Worker only stores its sha256 in `SANDBOX_KEYS`.
    sessionToken:
      type: http
      scheme: bearer
      description: Session token issued by `POST /v1/session` (`base64url(claims).base64url(HMAC-SHA256)`).
    statsKey:
      type: http
      scheme: bearer
      description: Read-only key `rk_...` from `STATS_KEYS`; doesn't work for the cache.

  parameters:
    ArtifactHash:
      name: hash
      in: path
      required: true
      description: Hex hash of the artifact (1–128 characters).
      schema: { type: string, pattern: "^[0-9a-fA-F]{1,128}$" }
    TeamId:
      name: teamId
      in: query
      description: Accepted for turbo compatibility but does NOT decide the prefix (the token does).
      schema: { type: string, maxLength: 256 }
    Slug:
      name: slug
      in: query
      description: Accepted for turbo compatibility but does NOT decide the prefix.
      schema: { type: string, maxLength: 256 }
    Repo:
      name: repo
      in: query
      required: true
      description: Numeric id of the GitHub repository (not its name).
      schema: { type: string, pattern: "^[1-9][0-9]{0,15}$" }
    Range:
      name: range
      in: query
      schema:
        type: string
        enum: ["1h", "24h", "7d", "30d", "90d"]
        default: 7d

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Body too large
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TurboBadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TurboError" }
    TurboUnauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TurboError" }
    TurboNotFound:
      description: Artifact not found in any of the prefixes the token can read
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TurboError" }
    TooManyRequests:
      description: |
        This IP sent too many requests without a valid credential (bad or missing Bearer, a
        failed `POST /v1/session`, a bad `rk_` key). Only failed credentials count: a valid
        credential is never limited. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer, example: 60 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: rate_limited, message: Too many requests }
    TurboTooManyRequests:
      description: Too many requests without a valid credential from this IP (see TooManyRequests)
      headers:
        Retry-After:
          schema: { type: integer, example: 60 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TurboError" }
    AnalyticsUnavailable:
      description: Analytics Engine did not answer correctly
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MetricsNotConfigured:
      description: CF_ACCOUNT_ID or CF_API_TOKEN is missing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [unauthorized] }
        message: { type: string }
    TurboError:
      description: "`Error` repeated inside `error`, which is what the turbo client reads."
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [error]
          properties:
            error: { $ref: "#/components/schemas/Error" }
    Tier:
      type: string
      enum: [main, main-ro, rama]
      description: |
        - `main`: reads and writes `main/<repoId>/`.
        - `main-ro`: only reads `main/<repoId>/`.
        - `rama` (the branch tier; `rama` is a fixed wire value): reads and writes
          `ramas/<repoId>/<branchKey>/`; on a read miss it falls back to `main/`.
    SessionKind:
      type: string
      enum: [ci, sandbox]
    SessionRequest:
      type: object
      properties:
        branch:
          type: string
          minLength: 1
          maxLength: 255
          description: Sandbox key only. A git branch (no spaces, control characters, `~^:?*[\`, `..`, or leading or trailing `/`).
    SessionResponse:
      type: object
      required: [token, expiresAt, repoId, repo, tier, branch, kind]
      properties:
        token: { type: string, description: "Session token for /v8 and /dav" }
        expiresAt: { type: string, format: date-time }
        repoId: { type: integer }
        repo: { type: string, examples: [acme/widgets] }
        tier: { $ref: "#/components/schemas/Tier" }
        branch: { type: string }
        kind: { $ref: "#/components/schemas/SessionKind" }
    CachingStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [disabled, enabled, over_limit, paused]
    ArtifactUploadResponse:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items: { type: string }
    ArtifactQueryRequest:
      type: object
      required: [hashes]
      properties:
        hashes:
          type: array
          maxItems: 1000
          items: { type: string }
    ArtifactInfo:
      type: object
      required: [size, taskDurationMs]
      properties:
        size: { type: integer }
        taskDurationMs: { type: integer }
        tag: { type: string }
    ArtifactQueryResponse:
      type: object
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/ArtifactInfo"
          - type: "null"
    CacheEvent:
      type: object
      required: [source, event, hash]
      properties:
        sessionId: { type: string, maxLength: 64 }
        source: { type: string, enum: [LOCAL, REMOTE] }
        event: { type: string, enum: [HIT, MISS] }
        hash: { type: string, maxLength: 128 }
        duration: { type: integer, minimum: 0 }
    Counters:
      type: object
      required: [requests, hits, hitsFromMain, misses, writes, bytesRead, bytesWritten, timeSavedMs, hitRate]
      properties:
        requests: { type: number, description: "Object reads (GET) + writes (PUT)" }
        hits: { type: number, description: "Hits, including those served from main/" }
        hitsFromMain: { type: number, description: "rama-tier hits served from main/" }
        misses: { type: number }
        writes: { type: number }
        bytesRead: { type: number, description: "Bytes served on hits" }
        bytesWritten: { type: number }
        timeSavedMs: { type: number, description: "Sum of x-artifact-duration of the hits (only Turbo reports it)" }
        hitRate:
          type: [number, "null"]
          description: hits / (hits + misses), with 4 decimals; null with no reads
    StatsResponse:
      type: object
      required: [repoId, range, generatedAt, totals, byTier, byKind, byProtocol]
      properties:
        repoId: { type: integer }
        range: { type: string, enum: ["1h", "24h", "7d", "30d", "90d"] }
        generatedAt: { type: string, format: date-time }
        totals: { $ref: "#/components/schemas/Counters" }
        byTier:
          type: object
          required: [main, main-ro, rama]
          properties:
            main: { $ref: "#/components/schemas/Counters" }
            main-ro: { $ref: "#/components/schemas/Counters" }
            rama: { $ref: "#/components/schemas/Counters" }
        byKind:
          type: object
          required: [ci, sandbox]
          properties:
            ci: { $ref: "#/components/schemas/Counters" }
            sandbox: { $ref: "#/components/schemas/Counters" }
        byProtocol:
          type: object
          required: [turbo, sccache]
          properties:
            turbo: { $ref: "#/components/schemas/Counters" }
            sccache: { $ref: "#/components/schemas/Counters" }
    BranchStats:
      type: object
      required: [branch, sandboxWrites, ciReads, ciHits, ciHitsOnSandboxObjects, reuseAlert]
      properties:
        branch: { type: string }
        sandboxWrites: { type: number, description: "Objects the sandbox wrote on the branch" }
        ciReads: { type: number, description: "CI reads on the branch (hits + misses)" }
        ciHits: { type: number, description: "CI hits (from the branch or from main/)" }
        ciHitsOnSandboxObjects: { type: number, description: "CI hits on objects the sandbox wrote" }
        reuseAlert: { type: boolean }
    BranchesResponse:
      type: object
      required: [repoId, range, generatedAt, reuseAlertMinWrites, branches]
      properties:
        repoId: { type: integer }
        range: { type: string, enum: ["1h", "24h", "7d", "30d", "90d"] }
        generatedAt: { type: string, format: date-time }
        reuseAlertMinWrites: { type: integer }
        branches:
          type: array
          description: Sorted by sandbox writes, highest first
          items: { $ref: "#/components/schemas/BranchStats" }
    RepoStats:
      type: object
      required: [repoId, repo, lastSeenAt, totals, reuseAlerts]
      properties:
        repoId: { type: integer }
        repo:
          type: [string, "null"]
          description: "`owner/repo`; null if neither the data points nor SANDBOX_KEYS know it"
          examples: [acme/widgets]
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: The most recent cache request in the range
        totals: { $ref: "#/components/schemas/Counters" }
        reuseAlerts: { type: integer, description: "The repo's branches with reuseAlert in the range" }
    ReposResponse:
      type: object
      required: [range, generatedAt, reuseAlertMinWrites, repos]
      properties:
        range: { type: string, enum: ["1h", "24h", "7d", "30d", "90d"] }
        generatedAt: { type: string, format: date-time }
        reuseAlertMinWrites: { type: integer }
        repos:
          type: array
          items: { $ref: "#/components/schemas/RepoStats" }
