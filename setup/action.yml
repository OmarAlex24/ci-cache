name: ci-cache setup
description: >-
  Requests a session from the ci-cache Worker with the GitHub Actions OIDC token and sets up
  Turbo (TURBO_API/TURBO_TOKEN/TURBO_TEAM) and, if there is Rust, sccache over WebDAV.
  The job needs `permissions: id-token: write`.

inputs:
  url:
    description: URL of the ci-cache Worker, without a trailing slash (e.g. https://ci-cache.<account>.workers.dev).
    required: true
  audience:
    description: Audience of the OIDC token; must match the Worker's CACHE_AUDIENCE.
    required: false
    default: ci-cache
  sccache:
    description: "auto (if there is a Cargo.toml), true or false."
    required: false
    default: auto
  sccache-version:
    description: sccache version to install.
    required: false
    default: 0.19.0
  sccache-sha256:
    description: >-
      SHA-256 of the sccache-v<version>-<arch>-unknown-linux-musl.tar.gz tarball. Required if
      you change sccache-version; for the default version it is already pinned (x86_64 and aarch64).
    required: false
    default: ""
  mount-workdir:
    description: >-
      true to mount the checkout at /home/user/<repo> (sudo mount --bind), the same path
      Boat sandboxes use, so that sccache keys match.
    required: false
    default: "false"
  fingerprint:
    description: true to print the cache fingerprint (scripts/cache-fingerprint.sh).
    required: false
    default: "true"

outputs:
  tier:
    description: The session's tier (main, main-ro or rama, the branch tier).
    value: ${{ steps.session.outputs.tier }}
  branch:
    description: The session's branch.
    value: ${{ steps.session.outputs.branch }}
  expires-at:
    description: Expiry of the session token (ISO 8601).
    value: ${{ steps.session.outputs.expires-at }}
  workdir:
    description: Directory to build in (/home/user/<repo> with mount-workdir, otherwise GITHUB_WORKSPACE).
    value: ${{ steps.session.outputs.workdir }}

runs:
  using: composite
  steps:
    - id: session
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_SCCACHE: ${{ inputs.sccache }}
        INPUT_SCCACHE_VERSION: ${{ inputs.sccache-version }}
        INPUT_SCCACHE_SHA256: ${{ inputs.sccache-sha256 }}
        INPUT_MOUNT_WORKDIR: ${{ inputs.mount-workdir }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    - if: inputs.fingerprint == 'true'
      shell: bash
      working-directory: ${{ steps.session.outputs.workdir }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/cache-fingerprint.sh"
