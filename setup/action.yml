name: ci-cache setup
description: >-
  Requests a session from the ci-cache Worker with the GitHub Actions OIDC token and sets up
  Turbo (TURBO_API/TURBO_TOKEN/TURBO_TEAM) and, if there is Rust, sccache over WebDAV.
  The job needs `permissions: id-token: write`.

inputs:
  url:
    description: URL of the ci-cache Worker, without a trailing slash (e.g. https://ci-cache.<your-subdomain>.workers.dev).
    required: true
  audience:
    description: Audience of the OIDC token; must match the Worker's CACHE_AUDIENCE.
    required: false
    default: ci-cache
  sccache:
    description: "auto (if there is a Cargo.toml), true or false."
    required: false
    default: auto
  sccache-version:
    description: sccache version to install.
    required: false
    default: 0.19.0
  sccache-sha256:
    description: >-
      SHA-256 of the sccache-v<version>-<arch>-unknown-linux-musl.tar.gz tarball. Required if
      you change sccache-version; for the default version it is already pinned (x86_64 and aarch64).
    required: false
    default: ""
  mount-workdir:
    description: >-
      Mount the checkout at `workdir-path` (sudo mount --bind), the path your sandboxes
      build in, so that sccache keys match; build in the `workdir` output.
      auto (default): mount when there is a Cargo.toml, on Linux with passwordless sudo,
      otherwise (or if mounting fails) skip it with a log line. true: mount or fail.
      false: never.
    required: false
    default: auto
  workdir-path:
    description: >-
      Absolute path that mount-workdir mounts the checkout at: where your sandboxes clone
      the repo. Empty (default) means /home/user/<repo>, where Boat sandboxes clone it.
      sccache keys include the path, so changing it on a repo that already uses the cache
      makes one cold run.
    required: false
    default: ""
  turbo-summary:
    description: >-
      true to export TURBO_RUN_SUMMARY=true (turbo writes .turbo/runs/*.json, like
      --summarize) so the report action can count Turbo cache hits. Not exported if the
      job already sets TURBO_RUN_SUMMARY.
    required: false
    default: "true"
  fingerprint:
    description: true to print the cache fingerprint (scripts/cache-fingerprint.sh).
    required: false
    default: "true"
  fingerprint-compare:
    description: >-
      true to upload this job's cache fingerprint and, on the branch tier, compare it with
      the one the branch's sandbox uploaded (ci-cache-env.sh): every line that enters the
      cache keys and differs becomes a warning and a row in the job summary. Never fails the job.
    required: false
    default: "true"

outputs:
  tier:
    description: The session's tier (main, main-ro or rama, the branch tier).
    value: ${{ steps.session.outputs.tier }}
  branch:
    description: The session's branch.
    value: ${{ steps.session.outputs.branch }}
  expires-at:
    description: Expiry of the session token (ISO 8601).
    value: ${{ steps.session.outputs.expires-at }}
  workdir:
    description: Directory to build in (workdir-path, by default /home/user/<repo>, when mounted; otherwise GITHUB_WORKSPACE).
    value: ${{ steps.session.outputs.workdir }}
  fingerprint-compare:
    description: >-
      Result of the sandbox vs CI fingerprint comparison: match, mismatch, none (no sandbox
      fingerprint for the branch), skipped (not the branch tier, or no session) or error.
    value: ${{ steps.compare.outputs.fingerprint-compare }}

runs:
  using: composite
  steps:
    - id: session
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_SCCACHE: ${{ inputs.sccache }}
        INPUT_SCCACHE_VERSION: ${{ inputs.sccache-version }}
        INPUT_SCCACHE_SHA256: ${{ inputs.sccache-sha256 }}
        INPUT_MOUNT_WORKDIR: ${{ inputs.mount-workdir }}
        INPUT_WORKDIR_PATH: ${{ inputs.workdir-path }}
        INPUT_TURBO_SUMMARY: ${{ inputs.turbo-summary }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    - if: inputs.fingerprint == 'true'
      shell: bash
      working-directory: ${{ steps.session.outputs.workdir }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/cache-fingerprint.sh"

    # After the session step: runs in the workdir (the mounted path) with its exports loaded.
    - id: compare
      if: inputs.fingerprint-compare == 'true' && steps.session.outputs.tier != ''
      shell: bash
      working-directory: ${{ steps.session.outputs.workdir }}
      env:
        INPUT_TIER: ${{ steps.session.outputs.tier }}
        INPUT_BRANCH: ${{ steps.session.outputs.branch }}
      run: bash "$GITHUB_ACTION_PATH/fingerprint-compare.sh"
